<ion-app>
  <ion-split-pane contentId="main-content" when="(min-width: 768px)">
    <!-- Side Menu -->
    <ion-menu contentId="main-content" type="overlay">
      <ion-header>
        <ion-toolbar color="tertiary">
          <ion-title>
            <img src="../../assets/whatsapp.jpg" style="height: 30px; vertical-align: middle;">

            <span style="margin-left: 10px;">Whatsapp Module</span>
          
          </ion-title>

        
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        <ion-button expand="block" color="success" style="margin-bottom: 10px;">
          <ion-icon name="logo-whatsapp" slot="start"></ion-icon>
          Send WhatsApp
        </ion-button>

        <ion-list lines="none">
          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/whatsapp/genralmodules" routerLinkActive="active-item"  routerDirection="forward">
              <ion-icon name="grid-outline" slot="start"></ion-icon>
              <ion-label>General module</ion-label>
            </ion-item>

            <ion-item routerLink="/whatsapp/addmodules" routerLinkActive="active-item" routerDirection="forward">
              <ion-icon name="add-circle-outline" slot="start"></ion-icon>
              <ion-label>Add Module <ion-badge color="warning">New</ion-badge></ion-label>
            </ion-item>

            <ion-item routerLink="/whatsapp/addtables" routerLinkActive="active-item" routerDirection="forward">
              <ion-icon name="list-outline" slot="start"></ion-icon>
              <ion-label>Add New Tables</ion-label>
            </ion-item>
              <ion-item routerLink="/whatsapp/variables" routerLinkActive="active-item"  routerDirection="forward">
              <ion-icon name="document-text-outline" slot="start"></ion-icon>
              <ion-label>Add new Variables</ion-label>
            </ion-item>
<!-- 
             <ion-item routerLink="/whatsapp/url" routerLinkActive="active-item"  routerDirection="forward">
              <ion-icon name="document-text-outline" slot="start"></ion-icon>
              <ion-label>Add new url</ion-label>
            </ion-item> -->

             <ion-item routerLink="/whatsapp/field" routerLinkActive="active-item"  routerDirection="forward">
              <ion-icon name="document-text-outline" slot="start"></ion-icon>
              <ion-label>Add new field</ion-label>
            </ion-item>


            <ion-item routerLink="/whatsapp/category" routerLinkActive="active-item" routerDirection="forward">
              <ion-icon name="create-outline" slot="start"></ion-icon>
              <ion-label>Add Category</ion-label>
            </ion-item>

            <ion-item routerLink="/whatsapp/subcategory" routerLinkActive="active-item"  routerDirection="forward">
              <ion-icon name="link-outline" slot="start"></ion-icon>
              <ion-label>Add SubCategory</ion-label>
            </ion-item>

            <ion-item routerLink="/whatsapp/template" routerLinkActive="active-item"  routerDirection="forward">
              <ion-icon name="document-text-outline" slot="start"></ion-icon>
              <ion-label>Template</ion-label>
            </ion-item>

                <ion-item slot="end" (click)="logout()" color="danger" >
          <ion-icon name="log-out-outline" ></ion-icon>
         Logout
        </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>

      <ion-footer>
        <ion-toolbar color="tertiary">
          <ion-title class="ion-text-center" style="color: white;">
            <h4>{{ isAdminLoggedIn ? 'Admin' : 'Name' }}: {{ user?.first_name }} {{ user?.last_name }}</h4>
          </ion-title>
        </ion-toolbar>
      </ion-footer>
    </ion-menu>

    <!-- Main Content -->
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
