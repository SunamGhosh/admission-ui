<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title class="ion-text-center" style="font-weight: bold;">
      Login Portal
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="login-content" style="background-color: #f4f4f4;">
  <ion-grid>
    <ion-row class="ion-justify-content-center ion-align-items-center full-height">
      <ion-col size-md="6" size-lg="4" style="margin-top: -120px;">
        <ion-card class="login-card" style="box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2); border-radius: 12px;">
          <ion-card-header class="ion-text-center" style="background-color: #007BFF; color: white; padding: 15px; border-radius: 12px 12px 0 0;">
            <ion-card-title style="font-size: 1.8rem;">Welcome Back!</ion-card-title>
            <p style="margin-top: 5px; font-size: 0.9rem;">Please login to continue</p>
          </ion-card-header>
          <ion-card-content style="padding: 20px;">
            <!-- Tabs for Admin/User -->
            <ion-segment value="user" color="primary" style="margin-bottom: 20px; box-shadow: inset 0px 1px 3px rgba(0, 0, 0, 0.2);">
              <ion-segment-button value="user">
                <ion-label>OFFICE</ion-label>
              </ion-segment-button>

              
              <ion-segment-button routerLink="/admin-login">
                <ion-label>Admin</ion-label>
              </ion-segment-button>



              <ion-segment-button  routerLink="/student-login">
                <ion-label>Student</ion-label>
              </ion-segment-button> 


<!--                  
              <ion-segment-button  routerLink="/faculty-login">
                <ion-label>Faculty</ion-label>
              </ion-segment-button> -->


                 <!-- <ion-segment-button  routerLink="/agent-login">
                <ion-label>Agent</ion-label>
              </ion-segment-button> -->
            </ion-segment>

            <!-- User Login Form -->
            <div>
              <ion-item class="input-item" style="margin-bottom: 15px;">
                <ion-label position="floating" style="padding-left: 20px; padding-top: -10px;">Email</ion-label>
                <ion-input [(ngModel)]="email" type="email"></ion-input>
                <ion-icon name="mail-outline" slot="start"></ion-icon>
              </ion-item>
              <ion-item class="input-item" style="margin-bottom: 15px;">
                <ion-label position="floating" style="padding-left: 20px; padding-top: -10px;">Password</ion-label>
                <ion-input 
                  [(ngModel)]="password" 
                  [type]="passwordVisible ? 'text' : 'password'">
                </ion-input>
                <ion-icon 
                  [name]="passwordVisible ? 'eye-outline' : 'eye-off-outline'" 
                  slot="end" 
                  (click)="togglePasswordVisibility()" 
                  style="cursor: pointer; font-size: 1.2rem; color: #555;">
                </ion-icon>
                <ion-icon name="people-outline" slot="start"></ion-icon>
              </ion-item>
              
              <ion-button expand="block" (click)="login()" color="primary" style="margin-top: 20px;">
                LOGIN AS USER
              </ion-button>
            </div>

           
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>


<style>
  .input-item ion-icon {
  margin-right: 10px;
}

</style>
