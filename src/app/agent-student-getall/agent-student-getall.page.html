<ion-header [translucent]="true">
  <ion-toolbar color="tertiary">
    <ion-title>All Students</ion-title>
  </ion-toolbar>
</ion-header>


<ion-content class="background">
  <div class="w3-container">
    <h2 class="w3-center w3-text-indigo">All Student</h2>

  

    <table class="w3-table-all w3-card-4 w3-striped w3-hoverable">
      <thead>
        <tr class="w3-purple">
          <th>Sl.No</th>
          <th>Full Name</th>
          <th>Email</th>
          <th>Mobile</th>
          <th>Course ID</th>
          <th>Application No</th>
          <th>10th Marks</th>
          <th>12th Marks</th>
         
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of filteredUsers; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ user.full_name }}</td>
          <td>{{ user.email || 'N/A' }}</td>
          <td>{{ user.mobile }}</td>
            <td class="grid-item">{{ getCourseName(user.course_id) }}</td>
          <td>{{ user.application_no || 'N/A' }}</td>
          <td>{{user.ten_marks}}</td>
          <td>{{user.twelve_marks}}</td>
        
        </tr>
      </tbody>
    </table>
  </div>



</ion-content>
