<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title class="text-center">Fees Management</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid class="custom-grid">
    <ion-row>
      <!-- User Details Section -->
      <ion-col size="6">
        <ion-card>
          <ion-card-header class="ion-text-center">
            <ion-card-title>User Details</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-grid>
              <ion-row class="header">
                <ion-col size="4">Field</ion-col>
                <ion-col size="5">Value</ion-col>
              </ion-row>
              <ion-row class="data-row">
                <ion-col size="4">Name</ion-col>
                <ion-col size="5">{{ user?.first_name }}</ion-col>
              </ion-row>
              <ion-row class="data-row">
                <ion-col size="4">Enrollment No</ion-col>
                <ion-col size="5">{{ user?.id }}</ion-col>
              </ion-row>
              <ion-row class="data-row">
                <ion-col size="4">Mobile</ion-col>
                <ion-col size="5">{{ user?.mobile }}</ion-col>
              </ion-row>
            </ion-grid>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <!-- Fee Structure Section -->
      <ion-col size="5">
        <ion-card>
          <ion-card-header class="ion-text-center">
            <ion-card-title>Fee Structure</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-grid>
              <ion-row class="header">
                <ion-col size="2">Category</ion-col>
                <ion-col size="5">Amount (₹)</ion-col>
              </ion-row>
              <ion-row class="data-row">
                <ion-col size="2">Total Fees</ion-col>
                <ion-col size="5">₹36,000</ion-col>
              </ion-row>
              <ion-row class="data-row">
                <ion-col size="2">Paid Fees</ion-col>
                <ion-col size="5">
                  <ion-badge color="success">Fully Paid</ion-badge>
                </ion-col>
              </ion-row>
              <ion-row class="data-row">
                <ion-col size="2">Remaining Fees</ion-col>
                <ion-col size="5">
                  <ion-badge color="tertiary">No Due</ion-badge>
                </ion-col>
              </ion-row>
            </ion-grid>

            <ion-card-header class="ion-text-center">
              <ion-card-title>Installment Details</ion-card-title>
            </ion-card-header>

            <ion-grid>
              <ion-row class="header">
                <ion-col size="3">Due Date</ion-col>
                <ion-col size="3">Amount (₹)</ion-col>
                <ion-col size="3">Status</ion-col>
              </ion-row>
              <ion-row class="data-row">
                <ion-col size="3">N/A</ion-col>
                <ion-col size="3">₹36,000</ion-col>
                <ion-col size="3">
                  <ion-badge color="success">Paid</ion-badge>
                </ion-col>
              </ion-row>
            </ion-grid>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
